<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دنیای بازی‌های ریاضی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;900&display=swap');
*{box-sizing:border-box;margin:0}
html{min-height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#1d3557;background:linear-gradient(180deg,#8fdcff 0%,#c9f1ff 55%,#fff4c2 100%);min-height:100vh;overflow-x:hidden}
#menu{position:relative;z-index:1;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 18px 40px;display:flex;flex-direction:column;align-items:center}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;bottom:-80px;font-weight:900;color:#fff;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(25deg)}}
header{text-align:center;margin:18px 0 26px;position:relative}
.grade{display:inline-block;background:#ff8a3d;color:#fff;font-weight:900;border-radius:999px;padding:4px 18px;font-size:15px;transform:rotate(-3deg);box-shadow:0 4px 0 #c75c14}
h1{font-size:clamp(34px,9vw,60px);font-weight:900;line-height:1.3;margin-top:10px;color:#1d3557;text-shadow:0 4px 0 #fff}
.sub{font-weight:700;color:#3d6a8a;font-size:17px;margin-top:4px}
.grid{position:relative;display:grid;gap:22px;width:min(100%,1000px);grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.game{--c:#2bb5b8;--d:#16888b;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border:0;cursor:pointer;font:inherit;color:#fff;background:var(--c);border-radius:34px;padding:26px 18px 22px;box-shadow:0 10px 0 var(--d),0 22px 30px rgba(20,60,100,.22);transition:transform .12s,box-shadow .12s}
.game:hover{transform:translateY(-4px)}
.game:active{transform:translateY(8px);box-shadow:0 2px 0 var(--d),0 6px 10px rgba(20,60,100,.2)}
.game:focus-visible{outline:5px solid #1d3557;outline-offset:4px}
.ico{font-size:76px;line-height:1.1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15))}
.game b{font-size:26px;font-weight:900}
.game small{font-size:15px;font-weight:700;opacity:.95;line-height:1.8}
.go{margin-top:10px;background:#fff;color:var(--d);font-weight:900;font-size:19px;border-radius:999px;padding:6px 28px}
.g1{--c:#22b8b0;--d:#117f79}.g1 .ico{animation:drive 2.4s ease-in-out infinite}
.g2{--c:#ff5d8f;--d:#b82a5a}.g2 .ico{animation:float 3s ease-in-out infinite}
.g3{--c:#6c4fe0;--d:#3f2aa0}.g3 .ico{animation:spin 6s linear infinite}
@keyframes drive{50%{transform:translateX(-10px)}}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes spin{50%{transform:scale(1.1) rotate(-8deg)}}
#play{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;display:none;flex-direction:column;background:#fff}
#play.on{display:flex}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:#1d3557;color:#fff}
#back{border:0;cursor:pointer;font:inherit;font-weight:900;font-size:17px;color:#1d3557;background:#ffd45a;border-radius:999px;padding:7px 18px;box-shadow:0 4px 0 #c79a12}
#back:active{transform:translateY(3px);box-shadow:0 1px 0 #c79a12}
#back:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ttl{font-weight:900;font-size:18px}
#frame{flex:1 1 auto;width:100%;border:0;background:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main id="menu">
  <header>
    <span class="grade">معلم: خانم پراش</span>
    <h1>دنیای بازی‌های ریاضی</h1>
    <p class="sub">یک بازی انتخاب کن و شروع کن!</p>
  </header>
  <div class="grid">
    <button class="game" style="--c:#22b8b0;--d:#117f79" data-i="0"><span class="ico">🏎️</span><b>مسابقه ریاضی</b><small>ماشینت رو با جواب‌های درست<br>به خط پایان برسون</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#ff5d8f;--d:#b82a5a" data-i="1"><span class="ico">🎈</span><b>ضرب بادکنکی</b><small>جدول ضرب رو یاد بگیر و<br>بادکنک‌ها رو بترکون</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#6c4fe0;--d:#3f2aa0" data-i="2"><span class="ico">🚀</span><b>کهکشان اعداد</b><small>با موشکت توی فضا سفر کن<br>و مأموریت ریاضی رو انجام بده</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#43b86a;--d:#23803f" data-i="3"><span class="ico">🐸</span><b>قورباغه کسرها</b><small>کسرها رو بشناس و<br>مگس‌ها رو شکار کن</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#c9955c;--d:#7a5230" data-i="4"><span class="ico">⏰</span><b>ساعت‌شناس</b><small>ساعت رو بخون و برگه‌ات<br>رو کامل کن</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#e63946;--d:#a01f2b" data-i="5"><span class="ico">🛒</span><b>فروشگاه کوچولو</b><small>فروشنده شو، حساب کن<br>و سکه جمع کن</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#2a8c99;--d:#14505a" data-i="6"><span class="ico">🤖</span><b>کارخانه الگوها</b><small>الگو رو پیدا کن و<br>ربات رو کامل کن</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#e9a800;--d:#9a7000" data-i="7"><span class="ico">🌻</span><b>باغ‌ساز</b><small>با جواب درست<br>باغت رو پر از گل کن</small><span class="go">بزن بریم!</span></button>
    <button class="game" style="--c:#7b4fe0;--d:#4a2a9c" data-i="8"><span class="ico">🪐</span><b>گردونه سیاره‌ها</b><small>گردونه رو بچرخون و عدد<br>حروفی رو با رقم بنویس</small><span class="go">بزن بریم!</span></button>
  </div>
</main>
<section id="play"><div id="bar"><button id="back">🏠 بازگشت به منو</button><span id="ttl"></span></div><iframe id="frame" title="بازی"></iframe></section>
